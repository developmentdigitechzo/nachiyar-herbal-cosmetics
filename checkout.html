<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Checkout | Nachiyar Herbals & Cosmetics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .checkout-page-container {
      padding-block: 40px 80px;
    }
    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 36px;
    }
    @media (min-width: 992px) {
      .checkout-grid {
        grid-template-columns: 1.2fr 0.8fr;
        gap: 50px;
      }
    }
    .checkout-form-card, .checkout-summary-card {
      background-color: var(--color-surface);
      border-radius: 20px;
      padding: 32px;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
    }
    .checkout-step-title {
      font-family: var(--font-display);
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 8px;
    }
    .form-group-checkout {
      margin-bottom: 16px;
    }
    .form-group-checkout label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--color-text-muted);
    }
    .checkout-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1.5px solid var(--color-border);
      font-family: inherit;
      font-size: 0.875rem;
    }
    .checkout-input:focus {
      outline: none;
      border-color: var(--color-lavender-primary);
    }
    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .checkout-item-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--color-border-subtle);
    }
    .chk-img {
      width: 56px;
      height: 72px;
      border-radius: 8px;
      object-fit: contain;
      object-position: center;
      background-color: #F8F6FA;
      border: 1px solid rgba(0, 0, 0, 0.06);
      padding: 3px;
    }
    .chk-info {
      flex: 1;
    }
    .chk-info h5 {
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 700;
    }
    .chk-info p {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }
    .chk-price {
      font-family: var(--font-display);
      font-weight: 800;
    }

    /* Payment Options & Subforms (Amazon & Flipkart E-Commerce standard) */
    .payment-options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .payment-option-card {
      border: 1.5px solid var(--color-border);
      border-radius: 14px;
      background: var(--color-canvas);
      overflow: hidden;
      transition: all 0.25s ease;
    }
    .payment-option-card.selected {
      border-color: var(--color-lavender-primary);
      background: #FFFFFF;
      box-shadow: 0 4px 16px rgba(124, 90, 171, 0.08);
    }
    .payment-option-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
    }
    .payment-radio-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #CBD5E1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .payment-option-card.selected .payment-radio-circle {
      border-color: var(--color-lavender-primary);
    }
    .payment-option-card.selected .payment-radio-circle::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-lavender-primary);
    }
    .payment-header-text {
      flex: 1;
    }
    .payment-header-text strong {
      display: block;
      font-size: 0.9375rem;
      color: var(--color-text-main);
    }
    .payment-header-text span {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }
    .payment-icons-badge {
      font-size: 1.25rem;
      display: flex;
      gap: 6px;
    }
    .payment-subform {
      display: none;
      padding: 18px;
      border-top: 1px dashed var(--color-border);
      background: #FAFAFC;
    }
    .payment-option-card.selected .payment-subform {
      display: block;
    }

    /* UPI Subform */
    .upi-apps-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .upi-app-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--color-border);
      background: #FFFFFF;
      font-size: 0.8125rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .upi-app-btn.active, .upi-app-btn:hover {
      border-color: var(--color-lavender-primary);
      background: #F4EFFC;
      color: var(--color-lavender-primary);
    }
    .upi-qr-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px;
      background: #FFFFFF;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      margin-top: 12px;
    }
    .upi-qr-box {
      width: 104px;
      height: 104px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 4px;
    }
    .upi-qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Bank Selector */
    .bank-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .bank-item-btn {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      background: #FFFFFF;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .bank-item-btn.active, .bank-item-btn:hover {
      border-color: var(--color-lavender-primary);
      background: #F4EFFC;
      color: var(--color-lavender-primary);
    }

    @media (max-width: 640px) {
      .checkout-page-container {
        padding-block: 24px 50px;
      }
      .checkout-form-card, .checkout-summary-card {
        padding: 20px 16px;
        border-radius: 16px;
      }
      .form-row-2 {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .chk-info h5 {
        font-size: 0.8125rem;
      }
      .checkout-input {
        padding: 10px 14px;
        font-size: 0.8125rem;
      }
      .upi-qr-card {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body class="page-body">

  <header class="site-header">
    <div class="header-container">
      <a href="/" class="brand-link">
        <div class="brand-crest">
          <img src="assets/nachiyar-logo.png" alt="Nachiyar Logo" class="brand-logo-img">
        </div>
        <div class="brand-text-lockup">
          <span class="brand-name">NACHIYAR</span>
          <span class="brand-sub">HERBALS & COSMETICS</span>
        </div>
      </a>
      <span style="font-size:0.8125rem; font-weight:700; color:var(--color-gold-dark);">🔒 100% Encrypted Checkout</span>
    </div>
  </header>

  <main class="checkout-page-container">
    <div class="section-container">
      
      <div class="checkout-grid">
        
        <!-- Left: Customer Information & Delivery Address -->
        <div class="checkout-form-card">
          <form id="checkoutForm">
            <h2 class="checkout-step-title">1. Customer Information</h2>
            <div class="form-row-2">
              <div class="form-group-checkout">
                <label>First Name *</label>
                <input type="text" id="chkFirstName" class="checkout-input" placeholder="Ananya" required>
              </div>
              <div class="form-group-checkout">
                <label>Last Name *</label>
                <input type="text" id="chkLastName" class="checkout-input" placeholder="Raman" required>
              </div>
            </div>
            <div class="form-row-2">
              <div class="form-group-checkout">
                <label>Email Address *</label>
                <input type="email" id="chkEmail" class="checkout-input" placeholder="ananya@example.com" required>
              </div>
              <div class="form-group-checkout">
                <label>Mobile Number (For Courier Updates) *</label>
                <input type="tel" id="chkPhone" class="checkout-input" placeholder="+91 98401 23456" required>
              </div>
            </div>

            <h2 class="checkout-step-title" style="margin-top:24px;">2. Pan-India Delivery Address</h2>
            <div class="form-group-checkout">
              <label>Street Address / Apartment *</label>
              <input type="text" id="chkAddress" class="checkout-input" placeholder="Flat 402, Lotus Apartments, 12th Main Road" required>
            </div>
            <div class="form-row-2">
              <div class="form-group-checkout">
                <label>City *</label>
                <input type="text" id="chkCity" class="checkout-input" placeholder="Chennai" required>
              </div>
              <div class="form-group-checkout">
                <label>State *</label>
                <input type="text" id="chkState" class="checkout-input" placeholder="Tamil Nadu" required>
              </div>
            </div>
            <div class="form-row-2">
              <div class="form-group-checkout">
                <label>PIN Code *</label>
                <input type="text" id="chkPincode" class="checkout-input" placeholder="600028" required>
              </div>
              <div class="form-group-checkout">
                <label>Delivery Landmark</label>
                <input type="text" id="chkLandmark" class="checkout-input" placeholder="Near Temple">
              </div>
            </div>

            <h2 class="checkout-step-title" style="margin-top:24px;">3. Payment Method</h2>
            <div class="payment-options-container" id="paymentOptionsContainer">
              <!-- Dynamically populated based on Admin Settings -->
              <div style="padding:16px; text-align:center; color:var(--color-text-muted);">
                Loading available payment options...
              </div>
            </div>

            <button type="submit" class="btn-checkout" style="margin-top:24px;" id="btnPlaceOrder">
              <span>Confirm Order</span>
              <span class="checkout-arrow">→</span>
            </button>
          </form>
        </div>

        <!-- Right: Order Review & Live Totals -->
        <div class="checkout-summary-card">
          <h2 class="checkout-step-title">Order Summary</h2>
          <div id="checkoutItemsList">
            <!-- Dynamic items -->
          </div>

          <!-- Coupon Code Input -->
          <div style="display:flex; gap:10px; margin-block:16px;">
            <input type="text" id="couponCodeInput" class="checkout-input" placeholder="Voucher Code (e.g. ROYAL10)">
            <button type="button" class="btn-secondary" id="btnApplyCoupon" style="white-space:nowrap;">Apply</button>
          </div>

          <div style="border-top:1px solid var(--color-border); padding-top:16px;">
            <div class="cart-subtotal-row">
              <span>Items Subtotal</span>
              <span id="chkSubtotalVal">₹0</span>
            </div>
            <div class="cart-shipping-row" id="chkDiscountRow" style="display:none; color:#DC2626;">
              <span>Voucher Discount</span>
              <span id="chkDiscountVal">-₹0</span>
            </div>
            <div class="cart-shipping-row">
              <span>Pan-India Delivery</span>
              <span id="chkShippingVal">FREE</span>
            </div>
            <div class="cart-subtotal-row" style="font-size:1.35rem; margin-top:12px; border-top:1.5px dashed var(--color-border); padding-top:12px;">
              <span>Total Payable</span>
              <span id="chkTotalVal">₹0</span>
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let cart = JSON.parse(localStorage.getItem('nachiyar_cart') || '[]');
      const itemsList = document.getElementById('checkoutItemsList');
      const subtotalVal = document.getElementById('chkSubtotalVal');
      const discountRow = document.getElementById('chkDiscountRow');
      const discountVal = document.getElementById('chkDiscountVal');
      const shippingVal = document.getElementById('chkShippingVal');
      const totalVal = document.getElementById('chkTotalVal');
      const checkoutForm = document.getElementById('checkoutForm');
      const btnApplyCoupon = document.getElementById('btnApplyCoupon');
      const couponInput = document.getElementById('couponCodeInput');
      const paymentContainer = document.getElementById('paymentOptionsContainer');
      const btnPlaceOrder = document.getElementById('btnPlaceOrder');

      let discountAmount = 0;
      let activePaymentMethod = 'cod'; // default selection
      let selectedUpiApp = 'Google Pay';
      let selectedBank = 'HDFC Bank';
      let paymentMethodsConfig = {};

      // 1. Fetch Admin Payment Settings
      try {
        const settingsRes = await fetch('/api/settings/public').then(r => r.json());
        if (settingsRes.success && settingsRes.data && settingsRes.data.paymentMethods) {
          paymentMethodsConfig = settingsRes.data.paymentMethods;
        } else {
          // Fallback if settings not yet initialized
          paymentMethodsConfig = {
            cod: { enabled: true, label: 'Cash on Delivery (COD)', description: 'Pay cash to courier upon delivery' },
            upi: { enabled: true, label: 'UPI Payments', upiId: 'nachiyarherbals18@okaxis', merchantName: 'Nachiyar Herbals' },
            card: { enabled: true, label: 'Credit / Debit Card' },
            netbanking: { enabled: true, label: 'Net Banking' }
          };
        }
      } catch (e) {
        console.error('Failed to fetch payment settings:', e);
      }

      function calculateTotals() {
        const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const shipping = subtotal >= 599 ? 0 : 70;
        const total = Math.max(0, subtotal - discountAmount) + shipping;
        return { subtotal, shipping, total };
      }

      function renderPaymentMethods() {
        const { total } = calculateTotals();
        paymentContainer.innerHTML = '';

        const methods = [
          { key: 'cod', title: 'Cash on Delivery (COD)', icon: '💵', sub: 'Pay cash to courier executive upon delivery' },
          { key: 'upi', title: 'UPI / QR (GPay, PhonePe, Paytm, BHIM)', icon: '⚡', sub: 'Zero convenience fees • Instant confirmation' },
          { key: 'card', title: 'Credit or Debit Card', icon: '💳', sub: 'Visa, MasterCard, RuPay, Maestro' },
          { key: 'netbanking', title: 'Net Banking', icon: '🏦', sub: 'Instant transfer from 50+ major Indian banks' }
        ];

        const enabledMethods = methods.filter(m => {
          const cfg = paymentMethodsConfig[m.key];
          return cfg ? cfg.enabled !== false : true;
        });

        if (enabledMethods.length === 0) {
          paymentContainer.innerHTML = `
            <div style="padding:18px; background:#FEF2F2; border:1px solid #FCA5A5; border-radius:12px; color:#991B1B; font-size:0.875rem;">
              ⚠️ No payment methods are currently active. Please contact customer support.
            </div>
          `;
          btnPlaceOrder.disabled = true;
          return;
        }

        // If currently selected method is disabled, select first enabled
        if (!enabledMethods.some(m => m.key === activePaymentMethod)) {
          activePaymentMethod = enabledMethods[0].key;
        }

        enabledMethods.forEach(m => {
          const isSelected = m.key === activePaymentMethod;
          const card = document.createElement('div');
          card.className = `payment-option-card ${isSelected ? 'selected' : ''}`;
          card.id = `optCard_${m.key}`;

          // Header
          let subformHtml = '';

          // 1. UPI Subform
          if (m.key === 'upi') {
            const upiId = (paymentMethodsConfig.upi && paymentMethodsConfig.upi.upiId) || 'nachiyarherbals18@okaxis';
            const merchantName = (paymentMethodsConfig.upi && paymentMethodsConfig.upi.merchantName) || 'Nachiyar Herbals & Cosmetics';
            const upiQrUri = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(merchantName)}&am=${total}&cu=INR`;
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiQrUri)}`;

            subformHtml = `
              <div class="payment-subform">
                <span style="display:block; font-size:0.75rem; font-weight:700; color:var(--color-text-muted); margin-bottom:8px;">CHOOSE UPI APP</span>
                <div class="upi-apps-row">
                  <button type="button" class="upi-app-btn ${selectedUpiApp === 'Google Pay' ? 'active' : ''}" data-app="Google Pay">
                    <span>🟢</span> Google Pay
                  </button>
                  <button type="button" class="upi-app-btn ${selectedUpiApp === 'PhonePe' ? 'active' : ''}" data-app="PhonePe">
                    <span>🟣</span> PhonePe
                  </button>
                  <button type="button" class="upi-app-btn ${selectedUpiApp === 'Paytm' ? 'active' : ''}" data-app="Paytm">
                    <span>🔵</span> Paytm
                  </button>
                  <button type="button" class="upi-app-btn ${selectedUpiApp === 'BHIM UPI' ? 'active' : ''}" data-app="BHIM UPI">
                    <span>🇮🇳</span> BHIM / Other UPI
                  </button>
                </div>

                <div class="upi-qr-card">
                  <div class="upi-qr-box">
                    <img src="${qrApiUrl}" alt="Scan to Pay via UPI" loading="lazy">
                  </div>
                  <div>
                    <strong style="display:block; font-size:0.875rem;">Scan &amp; Pay ₹${total}</strong>
                    <p style="font-size:0.75rem; color:var(--color-text-muted); margin:4px 0 6px;">
                      Scan using Google Pay, PhonePe, Paytm, or any UPI app.
                    </p>
                    <div style="display:inline-flex; align-items:center; gap:8px; padding:4px 10px; background:#F1F5F9; border-radius:6px; font-family:monospace; font-size:0.75rem;">
                      <span>VPA: <strong>${upiId}</strong></span>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }

          // 2. Card Subform
          if (m.key === 'card') {
            subformHtml = `
              <div class="payment-subform">
                <div class="form-group-checkout">
                  <label>Name on Card *</label>
                  <input type="text" id="cardHolderName" class="checkout-input" placeholder="Ananya Raman" autocomplete="cc-name">
                </div>
                <div class="form-group-checkout">
                  <label>Card Number *</label>
                  <input type="text" id="cardNumber" class="checkout-input" placeholder="4111 •••• •••• 1234" maxlength="19" autocomplete="cc-number">
                </div>
                <div class="form-row-2">
                  <div class="form-group-checkout">
                    <label>Expiry Date (MM/YY) *</label>
                    <input type="text" id="cardExpiry" class="checkout-input" placeholder="MM/YY" maxlength="5" autocomplete="cc-exp">
                  </div>
                  <div class="form-group-checkout">
                    <label>CVV / CVC *</label>
                    <input type="password" id="cardCvv" class="checkout-input" placeholder="•••" maxlength="4" autocomplete="cc-csc">
                  </div>
                </div>
                <p style="font-size:0.6875rem; color:var(--color-text-muted); margin-top:4px;">
                  🔒 256-bit SSL encrypted. Card credentials are processed securely and never stored.
                </p>
              </div>
            `;
          }

          // 3. Net Banking Subform
          if (m.key === 'netbanking') {
            const banks = ['HDFC Bank', 'State Bank of India', 'ICICI Bank', 'Axis Bank', 'Kotak Mahindra', 'Punjab National Bank'];
            subformHtml = `
              <div class="payment-subform">
                <span style="display:block; font-size:0.75rem; font-weight:700; color:var(--color-text-muted); margin-bottom:8px;">POPULAR INDIAN BANKS</span>
                <div class="bank-grid">
                  ${banks.map(b => `
                    <button type="button" class="bank-item-btn ${selectedBank === b ? 'active' : ''}" data-bank="${b}">
                      ${b}
                    </button>
                  `).join('')}
                </div>
                <p style="font-size:0.75rem; color:var(--color-text-muted); margin-top:12px;">
                  Selected Bank: <strong style="color:var(--color-lavender-primary);">${selectedBank}</strong>
                </p>
              </div>
            `;
          }

          // 4. COD Subform
          if (m.key === 'cod') {
            subformHtml = `
              <div class="payment-subform">
                <div style="background:#FFFBEB; border:1px solid #FDE68A; border-radius:8px; padding:10px 14px; font-size:0.8125rem; color:#92400E;">
                  <strong>💵 Cash on Delivery Selected:</strong> Please keep exact cash of <strong>₹${total}</strong> ready upon courier delivery.
                </div>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="payment-option-header" data-method="${m.key}">
              <div class="payment-radio-circle"></div>
              <div class="payment-header-text">
                <strong>${m.title}</strong>
                <span>${m.sub}</span>
              </div>
              <span class="payment-icons-badge">${m.icon}</span>
            </div>
            ${subformHtml}
          `;

          paymentContainer.appendChild(card);
        });

        // Wire event listeners on payment cards
        paymentContainer.querySelectorAll('.payment-option-header').forEach(header => {
          header.onclick = () => {
            activePaymentMethod = header.getAttribute('data-method');
            renderPaymentMethods();
          };
        });

        // UPI app button listeners
        paymentContainer.querySelectorAll('.upi-app-btn').forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            selectedUpiApp = btn.getAttribute('data-app');
            renderPaymentMethods();
          };
        });

        // Bank button listeners
        paymentContainer.querySelectorAll('.bank-item-btn').forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            selectedBank = btn.getAttribute('data-bank');
            renderPaymentMethods();
          };
        });

        // Card formatting helper
        const cardNumInput = document.getElementById('cardNumber');
        if (cardNumInput) {
          cardNumInput.oninput = (e) => {
            let v = e.target.value.replace(/\D/g, '').substring(0, 16);
            let parts = [];
            for (let i = 0; i < v.length; i += 4) {
              parts.push(v.substring(i, i + 4));
            }
            e.target.value = parts.join(' ');
          };
        }

        const cardExpInput = document.getElementById('cardExpiry');
        if (cardExpInput) {
          cardExpInput.oninput = (e) => {
            let v = e.target.value.replace(/\D/g, '').substring(0, 4);
            if (v.length >= 3) {
              e.target.value = v.substring(0, 2) + '/' + v.substring(2);
            } else {
              e.target.value = v;
            }
          };
        }

        // Update button label
        if (activePaymentMethod === 'cod') {
          btnPlaceOrder.innerHTML = `<span>Place Order via Cash on Delivery</span> <span class="checkout-arrow">→</span>`;
        } else {
          btnPlaceOrder.innerHTML = `<span>Pay ₹${total} &amp; Confirm Order</span> <span class="checkout-arrow">→</span>`;
        }
      }

      function renderCheckout() {
        if (cart.length === 0) {
          itemsList.innerHTML = '<p style="color:var(--color-text-muted); padding:20px; text-align:center;">Your bag is empty. <a href="shop.html">Shop Formulations</a></p>';
          subtotalVal.textContent = '₹0';
          totalVal.textContent = '₹0';
          btnPlaceOrder.disabled = true;
          return;
        }

        btnPlaceOrder.disabled = false;
        itemsList.innerHTML = '';
        let subtotal = 0;

        cart.forEach(item => {
          subtotal += (item.price * item.qty);
          const div = document.createElement('div');
          div.className = 'checkout-item-row';
          div.innerHTML = `
            <img src="${item.img}" alt="${item.name}" class="chk-img">
            <div class="chk-info">
              <h5>${item.name}</h5>
              <p>${item.size || ''} • Qty: ${item.qty}</p>
            </div>
            <span class="chk-price">₹${item.price * item.qty}</span>
          `;
          itemsList.appendChild(div);
        });

        const shipping = subtotal >= 599 ? 0 : 70;
        shippingVal.textContent = shipping === 0 ? 'FREE' : `₹${shipping}`;

        const grandTotal = Math.max(0, subtotal - discountAmount) + shipping;

        subtotalVal.textContent = `₹${subtotal}`;
        totalVal.textContent = `₹${grandTotal}`;

        if (discountAmount > 0) {
          discountRow.style.display = 'flex';
          discountVal.textContent = `-₹${discountAmount}`;
        } else {
          discountRow.style.display = 'none';
        }

        renderPaymentMethods();
      }

      btnApplyCoupon.onclick = () => {
        const code = couponInput.value.trim().toUpperCase();
        const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);

        if (code === 'ROYAL10') {
          discountAmount = Math.round(subtotal * 0.1);
          alert(`Coupon ROYAL10 applied! You saved ₹${discountAmount}`);
          renderCheckout();
        } else if (code === 'ROYAL15') {
          discountAmount = Math.round(subtotal * 0.15);
          alert(`Mystery Voucher ROYAL15 applied! You saved ₹${discountAmount}`);
          renderCheckout();
        } else {
          alert('Invalid voucher code.');
        }
      };

      checkoutForm.onsubmit = async (e) => {
        e.preventDefault();
        if (cart.length === 0) {
          alert('Your bag is empty.');
          return;
        }

        const { subtotal, shipping, total } = calculateTotals();

        // Validate specific method details if applicable
        const paymentDetails = {};
        if (activePaymentMethod === 'card') {
          const cardHolder = document.getElementById('cardHolderName')?.value.trim();
          const cardNum = document.getElementById('cardNumber')?.value.replace(/\s/g, '');
          const cardExp = document.getElementById('cardExpiry')?.value.trim();
          const cardCvv = document.getElementById('cardCvv')?.value.trim();

          if (!cardHolder || !cardNum || cardNum.length < 15 || !cardExp || !cardCvv) {
            alert('Please enter complete and valid credit/debit card details.');
            return;
          }
          paymentDetails.cardHolder = cardHolder;
          paymentDetails.cardBrand = cardNum.startsWith('4') ? 'Visa' : (cardNum.startsWith('5') ? 'MasterCard' : 'RuPay');
          paymentDetails.last4 = cardNum.slice(-4);
        } else if (activePaymentMethod === 'upi') {
          paymentDetails.upiProvider = selectedUpiApp;
        } else if (activePaymentMethod === 'netbanking') {
          paymentDetails.bankName = selectedBank;
        }

        // Method payload label mapping
        const methodLabels = {
          cod: 'Cash on Delivery (COD)',
          upi: `UPI (${selectedUpiApp})`,
          card: `Credit / Debit Card (${paymentDetails.cardBrand || 'Card'})`,
          netbanking: `Net Banking (${selectedBank})`
        };

        const payload = {
          customer: {
            name: `${document.getElementById('chkFirstName').value.trim()} ${document.getElementById('chkLastName').value.trim()}`,
            email: document.getElementById('chkEmail').value.trim(),
            phone: document.getElementById('chkPhone').value.trim(),
            address: document.getElementById('chkAddress').value.trim(),
            city: document.getElementById('chkCity').value.trim(),
            state: document.getElementById('chkState').value.trim(),
            pincode: document.getElementById('chkPincode').value.trim()
          },
          items: cart.map(i => ({
            productId: i.productId || i.id,
            name: i.name,
            price: i.price,
            qty: i.qty,
            size: i.size,
            img: i.img
          })),
          subtotal: subtotal,
          discount: discountAmount,
          shipping: shipping,
          total: total,
          paymentMethod: methodLabels[activePaymentMethod] || activePaymentMethod,
          paymentCategory: activePaymentMethod,
          paymentDetails: paymentDetails
        };

        btnPlaceOrder.disabled = true;
        btnPlaceOrder.innerHTML = '<span>Processing Order...</span>';

        let orderId = 'ord_' + Date.now();
        let orderNumber = 'NH-' + Math.floor(100000 + Math.random() * 900000);

        try {
          const res = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok && res.headers.get('content-type')?.includes('application/json')) {
            const data = await res.json();
            if (data.success && data.data) {
              orderId = data.data.id || orderId;
              orderNumber = data.data.orderNumber || orderNumber;
            }
          }
        } catch (apiErr) {
          console.warn('Backend API unavailable, saving order to local session:', apiErr);
        }

        // Always save order into customer orders store as reliable fallback
        try {
          const storedOrders = JSON.parse(localStorage.getItem('nachiyar_customer_orders') || '[]');
          storedOrders.unshift({
            id: orderId,
            orderNumber: orderNumber,
            customer: payload.customer,
            items: payload.items,
            pricing: payload.pricing,
            paymentMethod: payload.paymentMethod,
            status: 'confirmed',
            total: total,
            createdAt: new Date().toISOString()
          });
          localStorage.setItem('nachiyar_customer_orders', JSON.stringify(storedOrders));
        } catch (e) {}

        localStorage.removeItem('nachiyar_cart');
        window.location.href = `order-status.html?orderId=${orderId}&orderNumber=${orderNumber}`;
      };

      renderCheckout();
    });
  </script>
</body>
</html>
