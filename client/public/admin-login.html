<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Staff Login | Nachiyar Herbals</title>
  <!-- Nachiyar Royal Brand Favicon -->
  <link rel="icon" type="image/png" href="assets/nachiyar-logo.png">
  <link rel="shortcut icon" type="image/png" href="assets/nachiyar-logo.png">
  <link rel="apple-touch-icon" href="assets/nachiyar-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-canvas: #F9F8F5;
      --color-surface: #FFFFFF;
      --color-text-main: #191319;
      --color-text-muted: #6B626A;
      --color-lavender-primary: #7C5AAB;
      --color-lavender-dark: #583B82;
      --color-lavender-light: #ECE5F8;
      --color-gold: #D4AF37;
      --color-gold-dark: #A37F14;
      --color-gold-bg: rgba(212, 175, 55, 0.1);
      --color-border: rgba(25, 19, 25, 0.1);
      --color-border-focus: rgba(124, 90, 171, 0.5);
      --font-display: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--color-canvas);
      color: var(--color-text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      background-image: radial-gradient(circle at 50% 15%, rgba(236, 229, 248, 0.75) 0%, rgba(249, 248, 245, 1) 75%);
    }

    .login-container {
      width: 100%;
      max-width: 460px;
    }

    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 16px 40px rgba(25, 19, 25, 0.08), 0 2px 6px rgba(25, 19, 25, 0.03);
      position: relative;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-crest {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 16px;
      background: var(--color-lavender-primary);
      border: 2.5px solid var(--color-gold);
      box-shadow: 0 6px 20px rgba(124, 90, 171, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .brand-crest img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Reference Model: Pill badge with shield */
    .portal-eyebrow-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 6px 16px;
      background: var(--color-gold-bg);
      border: 1px solid rgba(163, 127, 20, 0.35);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-gold-dark);
      margin-bottom: 14px;
    }

    .portal-eyebrow-pill svg {
      color: var(--color-gold-dark);
      flex-shrink: 0;
    }

    /* Reference Model: Clean Title & Subtitle */
    .portal-title {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--color-text-main);
      line-height: 1.2;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .portal-subtitle {
      font-size: 0.875rem;
      color: var(--color-text-muted);
      line-height: 1.55;
      max-width: 380px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 14px;
      color: var(--color-text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.75;
    }

    .form-input {
      width: 100%;
      height: 50px;
      padding: 10px 16px 10px 44px;
      border-radius: 12px;
      border: 1.5px solid var(--color-border);
      background-color: #FAFAF8;
      font-family: inherit;
      font-size: 0.9375rem;
      color: var(--color-text-main);
      outline: none;
      transition: all 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-input.with-eye {
      padding-right: 46px;
    }

    .form-input:focus {
      background-color: #FFFFFF;
      border-color: var(--color-lavender-primary);
      box-shadow: 0 0 0 4px rgba(124, 90, 171, 0.12);
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      opacity: 0.7;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .btn-toggle-pwd:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .btn-submit {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #20142A 0%, #150F18 100%);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border: 1px solid rgba(212, 175, 55, 0.3);
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(25, 19, 25, 0.16);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #2D1A3B 0%, #20142A 100%);
      border-color: var(--color-gold);
      box-shadow: 0 8px 24px rgba(124, 90, 171, 0.25);
      transform: translateY(-1px);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .alert-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.8125rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-banner--error {
      background-color: #FDF2F4;
      border: 1px solid #F5C6CB;
      color: #872134;
    }

    .alert-banner--success {
      background-color: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: #166534;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
    }

    .login-footer a {
      color: var(--color-lavender-primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .login-footer a:hover {
      color: var(--color-lavender-dark);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
      }
      .portal-title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-crest">
          <img src="assets/nachiyar-logo.png" alt="Nachiyar Crest Logo">
        </div>

        <!-- Reference Model: Pill badge with shield icon -->
        <div class="portal-eyebrow-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>ADMINISTRATIVE OPERATING SYSTEM</span>
        </div>

        <!-- Reference Model: Exact Heading & Subtitle text -->
        <h1 class="portal-title">Admin Staff Login</h1>
        <p class="portal-subtitle">Sign in with your administrative credentials to access Orders, Products, Inventory & System Controls.</p>
      </div>

      <!-- Feedback Alert Banner -->
      <div id="alertBanner" class="alert-banner alert-banner--error" role="alert">
        <span id="alertIcon">⚠️</span>
        <span id="alertMessage">Invalid credentials.</span>
      </div>

      <!-- ==================== ADMIN STAFF LOGIN FORM ==================== -->
      <form id="signInForm" onsubmit="handleSignInSubmit(event)">
        
        <!-- Field 1: Staff Username or Email -->
        <div class="form-group">
          <label for="loginIdentifier" class="form-label">
            <span>STAFF EMAIL ADDRESS</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input 
              type="text" 
              id="loginIdentifier" 
              class="form-input" 
              placeholder="admin@nachiyarherbals.com or admin" 
              required 
              autocomplete="username"
              autofocus
            >
          </div>
        </div>

        <!-- Field 2: System Password with visibility toggle -->
        <div class="form-group">
          <label for="loginPassword" class="form-label">
            <span>SYSTEM PASSWORD</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="loginPassword" 
              class="form-input with-eye" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-pwd" id="btnTogglePwd" title="Show or hide password" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Reference Model: Sign In to Admin OS button -->
        <button type="submit" id="btnSignInSubmit" class="btn-submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <span>Sign In to Admin OS</span>
        </button>
      </form>
    </div>

    <div class="login-footer">
      <p>© 2026 NACHIYAR HERBALS & COSMETICS</p>
      <p style="margin-top: 6px;"><a href="/">← Return to Storefront</a></p>
    </div>
  </div>

  <script>
    const alertBanner = document.getElementById('alertBanner');
    const alertMessage = document.getElementById('alertMessage');
    const alertIcon = document.getElementById('alertIcon');
    const pwdInput = document.getElementById('loginPassword');
    const btnTogglePwd = document.getElementById('btnTogglePwd');
    const eyeIcon = document.getElementById('eyeIcon');

    // Password visibility toggle
    if (btnTogglePwd && pwdInput) {
      btnTogglePwd.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        if (isPassword) {
          btnTogglePwd.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>`;
        } else {
          btnTogglePwd.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>`;
        }
      });
    }

    function showAlert(msg, isSuccess = false) {
      alertBanner.className = isSuccess ? 'alert-banner alert-banner--success' : 'alert-banner alert-banner--error';
      alertIcon.textContent = isSuccess ? '✓' : '⚠️';
      alertMessage.textContent = msg;
      alertBanner.style.display = 'flex';
    }

    function hideAlert() {
      alertBanner.style.display = 'none';
    }

    // Handle Admin / Staff Sign In
    async function handleSignInSubmit(e) {
      e.preventDefault();
      hideAlert();

      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnSignInSubmit');

      const idLower = identifier.toLowerCase().trim();

      // Check if this ID was deleted by administrator
      const deletedAdmins = JSON.parse(localStorage.getItem('nachiyar_deleted_admins') || '[]');
      if (deletedAdmins.includes(idLower)) {
        showAlert('This admin account has been deactivated or deleted.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `
        <span style="display: inline-block; animation: spin 1s linear infinite;">⏳</span>
        <span>Verifying Credentials...</span>
      `;

      try {
        // Authenticate with Admin API endpoint
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: identifier, password: password })
        });

        if (res.ok) {
          const data = await res.json();
          if (data.success && data.token) {
            localStorage.setItem('nachiyar_admin_token', data.token);
            localStorage.setItem('nachiyar_admin_user', JSON.stringify(data.user));
            localStorage.removeItem('nachiyar_admin_active_tab');
            localStorage.setItem('nachiyar_admin_active_tab', 'dashboard');
            document.cookie = `nachiyar_admin_token=${data.token}; path=/; max-age=86400; SameSite=Lax`;
            showAlert('Access Granted! Launching Admin OS...', true);
            setTimeout(() => {
              window.location.replace('/admin.html#dashboard');
            }, 300);
            return;
          } else {
            showAlert(data.message || 'Invalid username or password. Please try again.');
          }
        } else if (res.status === 401 || res.status === 403) {
          const data = await res.json().catch(() => ({}));
          showAlert(data.message || 'Invalid username or password. Please try again.');
        } else {
          // If server returned 500 or offline, check for fallback offline verification
          checkLocalStaffFallback(identifier, password);
        }
      } catch (err) {
        // If server is unreachable, check local staff credentials
        checkLocalStaffFallback(identifier, password);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <span>Sign In to Admin OS</span>
        `;
      }
    }

    // Direct fallback for authorized administrators so operations are never blocked
    function checkLocalStaffFallback(identifier, password) {
      const idLower = identifier.toLowerCase().trim();

      // Check if this ID was deleted by administrator
      const deletedAdmins = JSON.parse(localStorage.getItem('nachiyar_deleted_admins') || '[]');
      if (deletedAdmins.includes(idLower)) {
        showAlert('This admin account has been deactivated or deleted.');
        return;
      }

      // Check dynamic admin accounts created inside Admin Console
      const customAccounts = JSON.parse(localStorage.getItem('nachiyar_admin_accounts') || '[]');
      const matched = customAccounts.find(acc => 
        (acc.username && acc.username.toLowerCase() === idLower) || 
        (acc.email && acc.email.toLowerCase() === idLower)
      );

      if (matched && matched.password === password) {
        const fallbackToken = 'staff_token_' + Date.now();
        localStorage.setItem('nachiyar_admin_token', fallbackToken);
        localStorage.setItem('nachiyar_admin_user', JSON.stringify(matched));
        localStorage.removeItem('nachiyar_admin_active_tab');
        localStorage.setItem('nachiyar_admin_active_tab', 'dashboard');
        document.cookie = `nachiyar_admin_token=${fallbackToken}; path=/; max-age=86400; SameSite=Lax`;
        showAlert(`Access Granted as ${matched.name || matched.username}! Launching Admin OS...`, true);
        setTimeout(() => {
          window.location.replace('/admin.html#dashboard');
        }, 300);
        return;
      }

      // Default system accounts (only if not explicitly deleted)
      let role = null;
      let name = null;

      if (!deletedAdmins.includes('admin') && (idLower === 'admin' || idLower === 'admin@nachiyar.com' || idLower === 'admin@nachiyarherbals.com') && password === 'admin123') {
        role = 'super_admin';
        name = 'Super Admin';
      }

      if (role) {
        const fallbackToken = 'staff_token_' + Date.now();
        const fallbackUser = { id: 'admin_master', name: name, username: identifier, role: role };
        localStorage.setItem('nachiyar_admin_token', fallbackToken);
        localStorage.setItem('nachiyar_admin_user', JSON.stringify(fallbackUser));
        localStorage.removeItem('nachiyar_admin_active_tab');
        localStorage.setItem('nachiyar_admin_active_tab', 'dashboard');
        document.cookie = `nachiyar_admin_token=${fallbackToken}; path=/; max-age=86400; SameSite=Lax`;
        showAlert('Staff Access Verified! Launching Admin OS...', true);
        setTimeout(() => {
          window.location.replace('/admin.html#dashboard');
        }, 300);
      } else {
        showAlert('Invalid username or password. Please try again.');
      }
    }
  </script>
</body>
</html>
